[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe71"
version = "0.1.0"
description = "GEMSDOE71 — Depth-Persistent Potential-Field Structure Tensor & Hydrothermal Demagnetization/Illitization Conjunction (DPST-HDT) for the DOE GEMS Geothermal Fault Discovery Prize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor/template66"]
testpaths = ["tests"]
